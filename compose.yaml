services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geradorsql-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:9.7
    container_name: geradorsql-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-geradorsql}"
      MYSQL_USER: "${DB_USERNAME:-geradorsql}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-geradorsql}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-33316}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
    name: geradorsql-mysql-data
